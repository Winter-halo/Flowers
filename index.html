<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>These Flowers Are For You</title>
  <style>
    :root {
      --cream: #fff8f1;
      --rose: #e8738d;
      --deep-rose: #9e3f5a;
      --pink: #f5b8c5;
      --peach: #ffc7a8;
      --leaf: #789b72;
      --stem: #557c5a;
      --ink: #4b3940;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 15% 15%, rgba(255,255,255,.95) 0 3px, transparent 4px),
        radial-gradient(circle at 82% 20%, rgba(255,255,255,.8) 0 2px, transparent 3px),
        radial-gradient(circle at 25% 85%, rgba(255,255,255,.8) 0 2px, transparent 3px),
        linear-gradient(135deg, #fce4e6, #fff4e7 48%, #f8d9dc);
      background-size: 180px 180px, 230px 230px, 270px 270px, auto;
    }

    .card {
      position: relative;
      width: min(92vw, 720px);
      min-height: 700px;
      margin: 32px 0;
      padding: 48px 32px 38px;
      overflow: hidden;
      text-align: center;
      border: 1px solid rgba(158,63,90,.15);
      border-radius: 32px;
      background: rgba(255, 250, 245, .78);
      box-shadow: 0 25px 70px rgba(126, 54, 74, .18), inset 0 0 0 10px rgba(255,255,255,.32);
      backdrop-filter: blur(8px);
      animation: appear 1.2s ease both;
    }

    .card::before,
    .card::after {
      content: "✦";
      position: absolute;
      color: rgba(158, 63, 90, .32);
      font-size: 22px;
      animation: twinkle 2.8s ease-in-out infinite;
    }
    .card::before { top: 35px; left: 48px; }
    .card::after { right: 52px; bottom: 38px; animation-delay: 1.2s; }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--deep-rose);
      font: 600 12px/1.2 Arial, sans-serif;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--deep-rose);
      font-size: clamp(34px, 7vw, 58px);
      font-weight: normal;
      line-height: 1.05;
    }

    .subtitle {
      margin: 14px auto 0;
      max-width: 470px;
      color: #86616a;
      font-size: 17px;
      line-height: 1.6;
    }

    .bouquet {
      position: relative;
      width: 360px;
      height: 360px;
      margin: 12px auto 0;
    }

    .stem {
      position: absolute;
      bottom: 38px;
      left: 50%;
      width: 5px;
      height: 245px;
      border-radius: 5px;
      background: linear-gradient(90deg, #416449, #7ea77a, #416449);
      transform-origin: bottom;
    }
    .stem.one { transform: rotate(-29deg); height: 220px; }
    .stem.two { transform: rotate(-13deg); height: 250px; }
    .stem.three { transform: rotate(0deg); height: 270px; }
    .stem.four { transform: rotate(15deg); height: 250px; }
    .stem.five { transform: rotate(29deg); height: 220px; }

    .leaf {
      position: absolute;
      width: 70px;
      height: 34px;
      border-radius: 100% 0 100% 0;
      background: linear-gradient(135deg, #9ab68a, #4f805d);
      box-shadow: inset 5px 3px 4px rgba(255,255,255,.3);
    }
    .leaf.l1 { left: 45px; top: 217px; transform: rotate(29deg); }
    .leaf.l2 { left: 78px; top: 176px; transform: rotate(-30deg) scale(.9); }
    .leaf.l3 { right: 42px; top: 212px; transform: rotate(150deg); }
    .leaf.l4 { right: 75px; top: 166px; transform: rotate(207deg) scale(.86); }
    .leaf.l5 { left: 132px; top: 237px; transform: rotate(55deg) scale(.7); }

    .flower {
      position: absolute;
      width: 112px;
      height: 112px;
      transform-origin: 50% 90%;
      animation: sway 4s ease-in-out infinite;
    }
    .flower.f1 { left: 28px; top: 66px; transform: rotate(-20deg) scale(.9); animation-delay: -.8s; }
    .flower.f2 { left: 92px; top: 20px; transform: rotate(-8deg) scale(1.03); animation-delay: -1.6s; }
    .flower.f3 { left: 145px; top: 0; transform: scale(1.12); animation-delay: -.3s; }
    .flower.f4 { right: 52px; top: 32px; transform: rotate(11deg) scale(1); animation-delay: -2s; }
    .flower.f5 { right: 11px; top: 79px; transform: rotate(22deg) scale(.87); animation-delay: -1.1s; }

    .petal {
      position: absolute;
      top: 14px;
      left: 38px;
      width: 42px;
      height: 72px;
      border-radius: 60% 60% 45% 45%;
      transform-origin: 50% 80%;
      background: linear-gradient(145deg, #ffdae0, var(--rose));
      box-shadow: inset 6px 4px 7px rgba(255,255,255,.36), 0 5px 8px rgba(158,63,90,.14);
    }
    .petal.p2 { transform: rotate(72deg); }
    .petal.p3 { transform: rotate(144deg); }
    .petal.p4 { transform: rotate(216deg); }
    .petal.p5 { transform: rotate(288deg); }
    .flower.f2 .petal, .flower.f4 .petal { background: linear-gradient(145deg, #ffe4c8, var(--peach)); }
    .flower.f3 .petal { background: linear-gradient(145deg, #ffd3df, #d95878); }
    .center {
      position: absolute;
      top: 49px;
      left: 48px;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffeaa5 0 7%, #e9a24e 8% 45%, #b96a45 46% 100%);
      box-shadow: 0 2px 3px rgba(100,50,40,.22);
    }

    .ribbon {
      position: absolute;
      left: 50%;
      bottom: 13px;
      width: 112px;
      height: 57px;
      transform: translateX(-50%);
      border-radius: 10px 10px 22px 22px;
      background: linear-gradient(90deg, #b54b68, #e4879a 50%, #b54b68);
      box-shadow: 0 7px 10px rgba(126,54,74,.18);
      z-index: 3;
    }
    .ribbon::before, .ribbon::after {
      content: "";
      position: absolute;
      bottom: -19px;
      width: 48px;
      height: 44px;
      background: #c65c76;
      clip-path: polygon(0 0, 100% 10%, 74% 100%, 50% 69%, 25% 100%);
    }
    .ribbon::before { left: 3px; transform: rotate(9deg); }
    .ribbon::after { right: 3px; transform: scaleX(-1) rotate(9deg); }

    .note {
      position: relative;
      max-width: 540px;
      margin: 3px auto 0;
      padding: 28px 26px 24px;
      border-radius: 18px;
      color: #633e49;
      background: rgba(255,255,255,.65);
      box-shadow: 0 8px 22px rgba(158,63,90,.08);
    }
    .note::before {
      content: "“";
      position: absolute;
      top: -18px;
      left: 17px;
      color: var(--rose);
      font: 70px Georgia, serif;
      line-height: 1;
    }
    .message {
      margin: 0;
      font-size: clamp(21px, 4vw, 29px);
      line-height: 1.45;
    }
    .signoff {
      margin: 15px 0 0;
      color: var(--deep-rose);
      font-style: italic;
      font-size: 17px;
    }

    .petal-fall {
      position: fixed;
      top: -30px;
      color: rgba(200, 83, 111, .45);
      font-size: 20px;
      pointer-events: none;
      animation: fall linear infinite;
    }
    .p1 { left: 8%; animation-duration: 8s; animation-delay: 1s; }
    .p2 { left: 25%; animation-duration: 10s; animation-delay: 4s; }
    .p3 { left: 73%; animation-duration: 9s; animation-delay: 2s; }
    .p4 { left: 91%; animation-duration: 11s; animation-delay: 5s; }

    @keyframes appear { from { opacity: 0; transform: translateY(18px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes sway { 0%, 100% { rotate: 0deg; } 50% { rotate: 2deg; } }
    @keyframes twinkle { 0%, 100% { opacity: .3; transform: scale(.8) rotate(0); } 50% { opacity: .9; transform: scale(1.15) rotate(18deg); } }
    @keyframes fall { 0% { transform: translateY(-40px) rotate(0); opacity: 0; } 15% { opacity: .8; } 100% { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

    @media (max-width: 500px) {
      .card { min-height: 650px; padding: 38px 18px 30px; }
      .bouquet { transform: scale(.82); transform-origin: top center; height: 310px; margin-bottom: -32px; }
      .note { padding: 25px 18px 20px; }
    }
  </style>
</head>
<body>
  <span class="petal-fall p1">✿</span>
  <span class="petal-fall p2">❀</span>
  <span class="petal-fall p3">✿</span>
  <span class="petal-fall p4">❀</span>

  <main class="card">
    <p class="eyebrow">A little something for you</p>
    <h1>Flowers for You</h1>
    <p class="subtitle">A bouquet made of soft colours, warm thoughts, and a little bit of missing you.</p>

    <section class="bouquet" aria-label="A hand-drawn bouquet of flowers">
      <span class="stem one"></span>
      <span class="stem two"></span>
      <span class="stem three"></span>
      <span class="stem four"></span>
      <span class="stem five"></span>
      <span class="leaf l1"></span><span class="leaf l2"></span><span class="leaf l3"></span><span class="leaf l4"></span><span class="leaf l5"></span>

      <div class="flower f1"><i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><b class="center"></b></div>
      <div class="flower f2"><i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><b class="center"></b></div>
      <div class="flower f3"><i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><b class="center"></b></div>
      <div class="flower f4"><i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><b class="center"></b></div>
      <div class="flower f5"><i class="petal p1"></i><i class="petal p2"></i><i class="petal p3"></i><i class="petal p4"></i><i class="petal p5"></i><b class="center"></b></div>
      <div class="ribbon"></div>
    </section>

    <section class="note">
      <p class="message">Maybe I can’t come meet you in person…<br />still, will you accept these flowers?</p>
      <p class="signoff">With a little thought of you</p>
    </section>
  </main>
</body>
</html>
